#AndroidCS: enforce UTF-8 & locale for Gradle daemon
android.nonTransitiveRClass=true
android.useAndroidX=true
# This host is aarch64: AGP downloads the x86_64 aapt2 from Maven by default,
# which cannot run here. Use the SDK's native binary instead.
android.aapt2FromMavenOverride=/tmp/opencode/android-sdk/build-tools/35.0.1/aapt2
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX\:MaxMetaspaceSize\=1g -Dfile.encoding\=UTF-8
